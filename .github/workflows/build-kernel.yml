name: Build taoyao kernel

on:
  workflow_dispatch:
  push:
    branches: [lineage-23.2]
    paths:
      - 'drivers/**'
      - 'arch/**'
      - 'fs/**'
      - 'kernel/**'
      - 'techpack/**'
      - 'Kconfig'
      - 'init/**'
      - '.gitmodules'
      - 'Makefile'
      - '.github/workflows/build-kernel.yml'

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Shallow clone: we only need the working tree, not full history.
          fetch-depth: 1
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 bc bison flex libssl-dev libelf-dev \
            cpio zstd zip wget kmod gcc g++ make
          df -h | tail -1

      - name: Restore AOSP clang cache
        id: clangcache
        uses: actions/cache/restore@v6
        with:
          # Cache the WHOLE toolchain (clang/): bin/ alone is not enough,
          # clang also needs lib/clang/*/include (stddef.h) and lib/LLVMPolly.so.
          path: clang
          key: clang-r563880c-14054515-v1

      - name: Download AOSP clang (cache miss only)
        if: steps.clangcache.outputs.cache-hit != 'true'
        run: |
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/531a564ba5426707dee226eccb19f104a7af5a5f/clang-r563880c.tar.gz"
          ok=
          for attempt in 1 2 3 4 5; do
            echo "== download attempt $attempt =="
            rm -f clang.tar.gz
            if curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
                 --connect-timeout 30 --speed-limit 1024 --speed-time 120 \
                 -o clang.tar.gz "$URL" && gzip -t clang.tar.gz; then
              ok=1
              break
            fi
            echo "attempt $attempt failed (truncated/corrupt), retrying in 15s"
            sleep 15
          done
          test -n "$ok"
          gzip -t clang.tar.gz
          mkdir -p clang
          tar -xf clang.tar.gz -C clang
          rm -f clang.tar.gz
          grep -Fx '21.0.0' clang/AndroidVersion.txt
          grep -Fx 'based on r563880c' clang/AndroidVersion.txt
          clang/bin/clang --version | head -1
          clang/bin/clang --version | grep -F 'clang version 21.0.0'
          ls clang/bin/clang clang/bin/ld.lld clang/lib/LLVMPolly.so
          ls clang/lib/clang/*/include/stddef.h

      - name: Persist toolchain cache even if build fails
        if: steps.clangcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: clang
          key: clang-r563880c-14054515-v1

      - name: Configure kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=gcc HOSTCXX=g++ CLANG_TRIPLE=aarch64-linux-gnu- taoyao_defconfig

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang HOSTCC=gcc HOSTCXX=g++ CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc)

      - name: Locate build outputs
        id: outputs
        run: |
          echo "IMG=$(find out -type f -path '*boot/Image' | head -1)" | tee -a $GITHUB_ENV
          echo "DTBO=$(find out -type f -name 'dtbo.img' | head -1)" | tee -a $GITHUB_ENV
          echo "DTB=$(find out -type f -name 'yupik.dtb' | head -1)" | tee -a $GITHUB_ENV
          ls -lh $IMG $DTBO $DTB

      - name: Package AnyKernel3 zip
        run: |
          rm -rf /tmp/ak3 && mkdir -p /tmp/ak3
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('arunika/taoyao-xxksu-0810-fixed-v2.zip')
          for n in z.namelist():
              z.extract(n, '/tmp/ak3')
          EOF
          cp -v "${IMG}"  /tmp/ak3/Image
          cp -v "${DTBO}" /tmp/ak3/dtbo.img
          cp -v "${DTB}"  /tmp/ak3/dtb
          chmod +x /tmp/ak3/tools/*
          (cd /tmp/ak3 && zip -r -q -9 /tmp/taoyao-lineage-ksu.zip .)
          ls -lh /tmp/taoyao-lineage-ksu.zip

      - name: Upload flashable zip
        uses: actions/upload-artifact@v7
        with:
          name: taoyao-lineage-ksu
          path: |
            /tmp/taoyao-lineage-ksu.zip
            out/.config
          retention-days: 14